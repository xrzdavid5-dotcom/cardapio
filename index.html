<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Cardápio — Choperia Clube</title>
  <meta name="description" content="Cardápio da Choperia Clube">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:flex;justify-content:center}
    .wrap{width:100%;max-width:900px;min-height:100vh;background:#171717}
    header{text-align:center;padding:28px 18px 20px;border-bottom:1px solid #333}
    .logo{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#d9a441;margin-bottom:8px}
    h1{margin:0;font-size:34px;letter-spacing:1px}
    .sub{margin:8px 0 0;color:#bbb;font-size:15px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px}
    .btn{display:inline-block;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #555;color:#fff;background:#242424}
    .btn.primary{background:#d9a441;color:#111;border-color:#d9a441}
    .viewer{padding:0 12px 24px}
    iframe{width:100%;height:calc(100vh - 180px);min-height:600px;border:0;border-radius:10px;background:#fff}
    .fallback{text-align:center;color:#aaa;font-size:13px;padding:0 20px 25px}
    footer{text-align:center;color:#777;font-size:12px;padding:18px;border-top:1px solid #2d2d2d}
    @media(max-width:600px){h1{font-size:28px}.viewer{padding:0 6px 18px}iframe{height:75vh;min-height:520px}.actions{padding:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">Choperia Clube</div>
      <h1>Cardápio</h1>
      <p class="sub">Confira nosso cardápio abaixo</p>
    </header>
    <div class="actions">
      <a class="btn primary" href="cardapio.pdf" target="_blank" rel="noopener">Abrir cardápio</a>
      <a class="btn" href="cardapio.pdf" download>Baixar PDF</a>
    </div>
    <section class="viewer">
      <iframe src="cardapio.pdf#view=FitH" title="Cardápio da Choperia Clube"></iframe>
    </section>
    <p class="fallback">Se o PDF não aparecer dentro da página, toque em “Abrir cardápio”.</p>
    <footer>Choperia Clube • Cardápio online</footer>
  </main>
</body>
</html>
